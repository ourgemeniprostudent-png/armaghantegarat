# Merge these locations into the site's existing server block; retain its PHP-FPM configuration.
# The public root points to the extracted WordPress directory; database files stay outside it.
location / { try_files $uri $uri/ /index.php?$args; }
location ~ ^/en/(wp-(content|admin|includes).*)$ { rewrite ^/en/(.*)$ /$1 last; }
location ~ ^/en/(.*\.php)$ { rewrite ^/en/(.*)$ /$1 last; }
location ~ /\. { deny all; }
location ~* ^/wp-content/armaghan-public/ { deny all; }
location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
# Keep the standard WordPress FastCGI PHP location from the hosting provider.
